<!DOCTYPE html>
<html>

<head>

    <title>EV Charging Point Management System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f9;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-box {
            width: 380px;
            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #1f2937;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            margin-bottom: 18px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 6px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            color: red;
        }

        .demo {
            margin-top: 25px;
            padding: 15px;

            background: #f3f4f6;

            border-radius: 6px;

            font-size: 13px;
        }

    </style>

</head>


<body>


<div class="login-box">

    <h1>⚡ EV Charging</h1>

    <p class="subtitle">
        Charging Point Management System
    </p>


    <form id="loginForm">

        <label>
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <p id="message"></p>


    <div class="demo">

        <strong>Demo Login</strong>

        <br><br>

        Resident:
        <br>
        krishna@gmail.com
        <br>
        Password: 12345

        <br><br>

        Admin:
        <br>
        admin@gmail.com
        <br>
        Password: admin123

    </div>

</div>



<script>


document.getElementById(
    "loginForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        // Get values from the input boxes

        const email =
            document.getElementById(
                "email"
            ).value;


        const password =
            document.getElementById(
                "password"
            ).value;


        console.log("Sending login:");
        console.log("Email:", email);
        console.log("Password:", password);


        try {

            const response =
                await fetch(
                    "/login",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            email: email,

                            password: password

                        })

                    }
                );


            const result =
                await response.text();


            if (!response.ok) {

                document.getElementById(
                    "message"
                ).innerText =
                    result;

                return;
            }


            // Convert response into user object

            const user =
                JSON.parse(result);


            // Save login information

            localStorage.setItem(
                "user",
                JSON.stringify(user)
            );


            // Redirect according to role

            if (user.Role === "ADMIN") {

                window.location.href =
                    "/admin.html";

            } else {

                window.location.href =
                    "/dashboard.html";

            }

        }

        catch (error) {

            console.log(error);

            document.getElementById(
                "message"
            ).innerText =
                "Something went wrong.";

        }

    }
);


</script>


</body>

</html>
